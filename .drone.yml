kind: pipeline
type: docker
name: test-and-build

env_file:
  - .env

services:
  redis:
    image: redis:7
    ports:
      - 6379:6379

  mongo:
    image: mongo:6
    ports:
      - 27017:27017

  sidekiq:
    image: ruby:3.1
    command: >
      sh -c "bundle exec sidekiq -q default -d"
    environment:
      REDIS_URL: ${REDIS_URL}

steps:
  - name: install-dependencies
    image: ruby:3.1
    commands:
      - apt-get update -qq && apt-get install -y nodejs npm
      - gem install bundler
      - bundle install

  - name: setup-database
    image: ruby:3.1
    environment:
      RAILS_ENV: test
      MONGODB_URI: ${MONGO_URL_TEST}
    commands:
      - bundle exec rake db:create
      - bundle exec rake db:schema:load

  - name: run-tests
    image: ruby:3.1
    environment:
      RAILS_ENV: test
      REDIS_URL: ${REDIS_URL}
      MONGODB_URI: ${MONGO_URL_TEST}
    commands:
      # Start Sidekiq in the background for the test run
      - bundle exec sidekiq -q default -d
      # Run Rails tests
      - bundle exec rails test
